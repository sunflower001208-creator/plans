<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="app-build" content="1025-0739-d675c6">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>PhD Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
/* Look: white paper, slate ink, serif titles (Georgia / Noto Serif SC), warm gold accent,
   thin-bordered rounded cards, pill navigation and a frosted sticky tab bar. Layout: sticky masthead with sync chip + tab rail;
   the week sheet pulls to-dos from every area; each area sheet is trackers (status, to-do/DDL, progress log) then reference notes. */
:root{
  --bg:#FBFBFD; --surface:#FFFFFF; --sunk:#F3F5F8; --ink:#1E293B; --muted:#64748B; --line:#E2E8F0; --hair:#EEF1F5; --grid:transparent;
  --c-research:#3A6EA5; --c-exp:#3D7F63; --c-dim:#B0506E; --c-admin:#7556A8; --c-think:#8E6A2E;
  --accent:#8E6A2E; --accent-hi:#D4A562; --accent-soft:#FAF4EA; --on-accent:#FFFFFF; --btn:#1E293B; --on-btn:#FFFFFF;
  --p0:#C62E3A; --p0-bg:#FDEEEF; --p1:#A15C07; --p1-bg:#FBF3E4; --p2:#2F7D57; --p2-bg:#E9F6EF; --p3:#64748B; --p3-bg:#F1F5F9;
  --ok:#2F7D57; --warn:#A15C07; --bad:#C62E3A; --shadow:rgba(15,23,42,.12); --card-shadow:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.03);
  --glass:rgba(251,251,253,.78);
  --f-display:Georgia,"Noto Serif SC","Songti SC","Source Han Serif SC",STSong,serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --f-code:ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang SC","Noto Sans SC",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F172A; --surface:#1A2335; --sunk:#243049; --ink:#F1F5F9; --muted:#94A3B8; --line:#2C3850; --hair:#243047; --grid:transparent;
  --c-research:#8AB4E8; --c-exp:#7CCBA6; --c-dim:#EE9BB5; --c-admin:#BBA3E8; --c-think:#E4B976;
  --accent:#E4B976; --accent-hi:#E4B976; --accent-soft:rgba(228,185,118,.13); --on-accent:#0F172A; --btn:#F1F5F9; --on-btn:#0F172A;
  --p0:#F2848B; --p0-bg:rgba(242,132,139,.14); --p1:#E9B872; --p1-bg:rgba(228,185,118,.14); --p2:#74D0A1; --p2-bg:rgba(116,208,161,.13); --p3:#A3AEBD; --p3-bg:rgba(148,163,184,.14);
  --ok:#74D0A1; --warn:#E9B872; --bad:#F2848B; --shadow:rgba(0,0,0,.5); --card-shadow:none; --glass:rgba(15,23,42,.78); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F172A; --surface:#1A2335; --sunk:#243049; --ink:#F1F5F9; --muted:#94A3B8; --line:#2C3850; --hair:#243047; --grid:transparent;
  --c-research:#8AB4E8; --c-exp:#7CCBA6; --c-dim:#EE9BB5; --c-admin:#BBA3E8; --c-think:#E4B976;
  --accent:#E4B976; --accent-hi:#E4B976; --accent-soft:rgba(228,185,118,.13); --on-accent:#0F172A; --btn:#F1F5F9; --on-btn:#0F172A;
  --p0:#F2848B; --p0-bg:rgba(242,132,139,.14); --p1:#E9B872; --p1-bg:rgba(228,185,118,.14); --p2:#74D0A1; --p2-bg:rgba(116,208,161,.13); --p3:#A3AEBD; --p3-bg:rgba(148,163,184,.14);
  --ok:#74D0A1; --warn:#E9B872; --bad:#F2848B; --shadow:rgba(0,0,0,.5); --card-shadow:none; --glass:rgba(15,23,42,.78); color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:64px}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
button{font-family:inherit}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* masthead */
.mast{background:var(--bg)}
.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.mast-row{display:flex;align-items:center;gap:10px 14px;padding-block:10px 4px;flex-wrap:wrap}
.brand{font:600 20px/1.1 var(--f-display);letter-spacing:.005em;margin:0}
.brand small{display:block;font:400 11.5px/1.4 var(--f-mono);color:var(--muted);margin-top:3px}
.mast-tools{display:flex;gap:8px;align-items:center;margin-left:auto;flex:1 1 300px;justify-content:flex-end;min-width:0}
.search{position:relative;flex:1 1 200px;max-width:360px;min-width:0}
.search input{width:100%;font:14px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 34px 7px 11px}
.search input:not(:placeholder-shown)+kbd{display:none}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:11px var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;pointer-events:none}
.results{position:absolute;right:0;top:calc(100% + 6px);width:min(560px,calc(100vw - 32px));max-height:60vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px var(--shadow);padding:6px;z-index:40}
.results button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:13.5px/1.5 var(--f-body);padding:8px 10px;border-radius:6px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--sunk)}
.results .rt{font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);display:block}
.results mark{background:var(--p1-bg);color:var(--ink);border-radius:2px}
.results .empty{padding:10px;color:var(--muted);font-size:13px}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font:500 12px var(--f-mono);padding:7px 10px;cursor:pointer;white-space:nowrap}
.sync{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;font:500 11.5px var(--f-mono);padding:6px 10px;cursor:pointer;white-space:nowrap}
.sync[data-s="ok"]{color:var(--ok)} .sync[data-s="dirty"],.sync[data-s="saving"]{color:var(--warn)}
.sync[data-s="error"],.sync[data-s="auth"],.sync[data-s="offline"]{color:var(--bad);border-color:var(--bad)}
.tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;padding:8px 11px 9px;font:500 14.5px var(--f-body);color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
.tab .n{font:500 10.5px var(--f-mono);margin-left:4px;padding:1px 5px;border-radius:99px;background:var(--p0-bg);color:var(--p0)}

/* sheet */
main{padding-block:24px 72px}
.panel{display:grid;gap:30px}
.sec{display:grid;gap:12px;min-width:0;align-content:start}
.sec-h{display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap}
.sec-h h2{font:600 19px/1.25 var(--f-display);margin:0;text-wrap:balance}
.sec-h .aside{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h3{font:600 16px/1.3 var(--f-display);margin:0;text-wrap:balance}
.eyebrow{font:500 11px/1.3 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);margin:0;max-width:72ch}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0;display:grid;gap:10px;align-content:start}
.box-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.box-h h3{flex:1;min-width:0}
.grid2{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));align-items:start}
.cols{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));align-items:start}
.stack{display:grid;gap:20px;align-content:start;min-width:0}
ul.list{margin:0;padding-left:1.15em;display:grid;gap:5px}
ul.list li{min-width:0;overflow-wrap:anywhere}
ul.list li::marker{color:var(--muted)}
ul.list ul.list{margin-top:4px;color:var(--muted);font-size:14px}
.para{margin:0;overflow-wrap:anywhere}
strong{font-weight:600}
.k{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
.blank{color:var(--muted);font-style:italic;font-size:13.5px;margin:0}

/* hero */
.hero{background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border:1px solid var(--line);border-radius:12px;padding:20px 22px;display:grid;gap:10px}
.umb{font:600 clamp(22px,3.2vw,30px)/1.15 var(--f-display);margin:0;text-wrap:balance;max-width:30ch}
.umb-sub{margin:0;color:var(--muted);max-width:72ch}
.goal{margin:0;padding:2px 0 2px 14px;border-left:2px solid var(--accent);font-size:15.5px;max-width:72ch}
.goal cite{display:block;font-style:normal;color:var(--muted);font-size:13px;margin-top:4px}

/* controls */
select.pill{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background-color:var(--surface);color:var(--ink);font:500 12px/1.2 var(--f-mono);padding:4px 22px 4px 9px;border-radius:999px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 11px) 52%,calc(100% - 7px) 52%;background-size:4px 4px;background-repeat:no-repeat;max-width:100%}
select.pri[data-p="P0"]{color:var(--p0);background-color:var(--p0-bg);border-color:transparent}
select.pri[data-p="P1"]{color:var(--p1);background-color:var(--p1-bg);border-color:transparent}
select.pri[data-p="P2"]{color:var(--p2);background-color:var(--p2-bg);border-color:transparent}
select.pri[data-p="P3"]{color:var(--p3);background-color:var(--p3-bg);border-color:transparent}
select.pri[data-p="none"]{color:var(--muted);border-style:dashed}
select.st{color:var(--muted)}
.pdot{display:inline-block;font:500 11px/1 var(--f-mono);padding:3px 6px;border-radius:4px;vertical-align:1px}
.pdot.P0{color:var(--p0);background:var(--p0-bg)} .pdot.P1{color:var(--p1);background:var(--p1-bg)}
.pdot.P2{color:var(--p2);background:var(--p2-bg)} .pdot.P3{color:var(--p3);background:var(--p3-bg)} .pdot.none{color:var(--muted);background:var(--sunk)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chipbtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:500 12px var(--f-mono);padding:4px 10px;border-radius:999px;cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.linkbtn{border:0;background:none;color:var(--accent);font:500 12.5px var(--f-body);padding:2px 0;cursor:pointer;justify-self:start;text-align:left}
.linkbtn.muted{color:var(--muted)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font:500 13px var(--f-body);padding:6px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.sm{font-size:12px;padding:3px 9px}
.tag{font:500 10.5px/1 var(--f-mono);padding:3px 6px;border-radius:4px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tags{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:1px;margin-left:4px}
.field,input.field,textarea.field,select.field{font:14px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0;width:100%}
textarea.field{min-height:84px;resize:vertical;line-height:1.55}
textarea.code{font:13px/1.55 var(--f-mono)}
input[type=date].field{font:12.5px var(--f-mono);width:auto}
form.edit{display:grid;gap:8px;padding:10px 12px;border:1px dashed var(--accent);border-radius:9px;background:var(--accent-soft)}
form.edit label{display:grid;gap:3px;font-size:12.5px;color:var(--muted)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:12px;color:var(--muted);margin:0}

/* tracker rows & cards */
.rows{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.row{display:grid;gap:6px;padding:11px 14px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row-top{display:flex;gap:8px 12px;align-items:flex-start;flex-wrap:wrap}
.row-main{flex:1 1 260px;min-width:0}
.row-title{font-weight:500}
.row-sub{font-size:13.5px;color:var(--muted)}
.row-ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row-foot{display:flex;gap:4px 14px;flex-wrap:wrap;align-items:center}
.projs{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));align-items:start}
.proj{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px;min-width:0}
.proj-h{display:flex;gap:10px;align-items:baseline}
.proj-id{font:600 13px/1 var(--f-mono);color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:4px 6px;flex:none}
.proj-h h3{flex:1;min-width:0}
.tgt{font:500 12px var(--f-mono);color:var(--muted);white-space:nowrap}
.meta{font-size:13.5px;color:var(--muted)}
.stages{display:flex;flex-wrap:wrap;gap:6px 14px;font:500 12.5px var(--f-mono);color:var(--muted)}
.stages b{color:var(--ink);font-weight:600}
.empty-card{border:1px dashed var(--line);border-radius:10px;padding:14px;color:var(--muted);font-size:13.5px}

/* to-dos */
.todos{display:grid;min-width:0}
.td{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--hair);min-width:0}
.todos > .td:first-child{border-top:0}
.td input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0;flex:none}
.td-t{flex:1 1 180px;min-width:0;font-size:14px;cursor:pointer;overflow-wrap:anywhere}
.td.done .td-t{text-decoration:line-through;color:var(--muted)}
button.td-t{border:0;background:none;padding:2px 4px;margin-left:-4px;text-align:left;color:inherit;font:inherit;font-size:14px;cursor:text;border-radius:5px}
button.td-t:hover{background:var(--sunk)}
.td-edit{flex:1 1 220px;min-width:0;display:flex}
.td-edit .field{padding:4px 8px;font-size:14px}
.pen{border:0;background:none;color:var(--muted);font-size:15px;line-height:1;padding:5px 6px;border-radius:6px;cursor:pointer;flex:none}
.pen:hover,.pen:focus-visible{background:var(--sunk);color:var(--ink)}
@media (hover:hover){.it-row .pen{opacity:0}.it-row:hover .pen,.it-row:focus-within .pen{opacity:1}}
.td .x{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:2px 4px;cursor:pointer;border-radius:4px}
.td .x:hover{color:var(--bad)}
input.ddl{font:12px var(--f-mono);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:2px 5px;max-width:9.6em}
input.ddl:not(.has){opacity:.45}
.due{font:500 11.5px/1 var(--f-mono);padding:4px 7px;border-radius:999px;white-space:nowrap}
.due.over{background:var(--p0-bg);color:var(--p0)} .due.soon{background:var(--p1-bg);color:var(--p1)} .due.later{background:var(--sunk);color:var(--muted)}
.wkb{border:0;background:none;color:var(--muted);font:500 11.5px var(--f-mono);padding:3px 5px;border-radius:5px;cursor:pointer;white-space:nowrap}
.wkb:hover{background:var(--sunk);color:var(--ink)}
.wkb.on{color:var(--accent);background:var(--accent-soft)}
.wx{border:0;background:none;color:var(--muted);font-size:17px;line-height:1;padding:2px 6px;border-radius:5px;cursor:pointer;opacity:.5;flex:none}
.wx:hover,.wx:focus-visible{opacity:1;color:var(--bad);background:var(--sunk)}
.proj-h .wx{align-self:flex-start}
.ichip{border:0;background:var(--sunk);color:var(--muted);font:500 11.5px var(--f-mono);padding:3px 7px;border-radius:5px;cursor:pointer;max-width:17em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ichip:hover{color:var(--ink)}
form.add{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:6px}
form.add input[type=text]{flex:1 1 200px;width:auto}
form.add select.field{flex:0 1 230px;width:auto}

/* progress log */
.log{display:grid;gap:0;font-size:13.5px}
.log-e{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:8px;padding:5px 0;border-top:1px solid var(--hair);align-items:baseline}
.log-e:first-child{border-top:0}
.log-e .d{font:500 12px var(--f-mono);color:var(--muted)}
.log-e.auto .t{color:var(--muted)}
.log-e .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0 4px}
.lastlog{font-size:13px;color:var(--muted)}
.lastlog .d{font-family:var(--f-mono);margin-right:6px}

/* week */
.wknav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wklabel{font:600 22px/1.1 var(--f-display)}
.wklabel small{font:500 13px var(--f-mono);color:var(--muted);margin-left:8px}
.grp{display:grid;gap:2px}
.grp-h{display:flex;gap:8px;align-items:baseline;padding-top:8px}
.grp-h .k{color:var(--accent)}
.meter{display:flex;align-items:center;gap:8px;font:500 12px var(--f-mono);color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.hist{display:grid}
.hist button{display:grid;grid-template-columns:120px 1fr auto;gap:4px 14px;align-items:baseline;text-align:left;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);padding:10px 4px;cursor:pointer;font:14px var(--f-body)}
.hist button:first-child{border-top:0}
.hist button:hover{background:var(--sunk)}
.hist .w{font:600 13px var(--f-mono)}
.hist .w small{display:block;font-weight:400;color:var(--muted)}
.hist .g{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hist .s{font:500 12px var(--f-mono);color:var(--muted);white-space:nowrap}

/* timeline */
.tl-p{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tl-p:first-child{border-top:0}
.tl-when{font:500 13px/1.4 var(--f-mono);padding-top:6px}
.tl-p.now .tl-when{color:var(--accent)}
.tl-p.now .tl-when::after{content:"现在";display:block;width:max-content;font-size:10.5px;letter-spacing:.06em;margin-top:4px;padding:2px 6px;border-radius:4px;background:var(--accent-soft)}
.tl-p.past{opacity:.62}
.tl-p.over .tl-when{color:var(--bad)}

/* freshness */

</style>
</head>
<body>
<header class="mast">
  <div class="wrap">
    <div class="mast-row">

      <div class="mast-tools">

<script>
(function(){
'use strict';

/* ============================== constants ============================== */
const TABS=[['week','本周'],['research','科研'],['exp','经历'],['admin','杂事'],['dim','维度'],['think','思考'],['tl','时间线']];
const TABNAME=Object.fromEntries(TABS);
const AREAS=['research','exp','admin','career','profile','step'];
const AREANAME={research:'科研',exp:'经历',intern:'经历',visit:'经历',career:'维度',profile:'维度',expo:'维度',net:'维度',talk:'维度',service:'维度',admin:'杂事',step:'思考'};
const SECTIONS=[['research','科研'],['exp','经历'],['admin','杂事'],['dim','维度'],['think','思考']];
const secOf=a=>({research:'research',exp:'exp',intern:'exp',visit:'exp',admin:'admin',net:'dim',talk:'dim',service:'dim',career:'dim',profile:'dim',expo:'dim'})[a]||'think';
const SECNAME=Object.fromEntries(SECTIONS);
const secItems=sec=>D.items.filter(x=>secOf(x.area)===sec);
const PRI=[['P0','P0 紧急'],['P1','P1 重要'],['P2','P2 推进'],['P3','P3 有空'],['','— 未设']];
const PRANK={P0:0,P1:1,P2:2,P3:3,'':4};
const SETS={
  proj:['Maintaining','Submitting','Pushing','Starting','Paused','Done'],
  collab:['参与中','想法','待联系','观望','已结束'],
  lead:['想法','待联系','聊过','合作中','放弃'],
  intern:['想法','联系中','已投递','面试中','Offer','放弃'],
  visit:['想法','联系中','申请中','已确定','放弃'],
  app:['关注','准备中','已提交','有结果','放弃'],
  todo:['想法','准备中','进行中','完成'],
  person:['想认识','联系中','聊过','保持联系'],
};
const KIND_SET={promo:'todo',person:'person',proj:'proj',collab:'collab',lead:'lead',intern:'intern',visit:'visit',app:'app',todo:'todo',step:'todo'};
const TAGS={r:'研究',i:'实习',v:'Visiting',c:'职业',p:'曝光',m:'心态'};
const TAGCODE={'研究':'r','实习':'i','visiting':'v','访问':'v','职业':'c','曝光':'p','心态':'m'};
const EMPTY={v:2,items:[],todos:[],logs:[],weeks:{},routines:[],
  steps:[{id:'hb',title:'退半步',en:'Half a Step Back',desc:'',items:[],checks:{},history:[]},{id:'fb',title:'退一步',en:'Full Step Back',desc:'',items:[],checks:{},history:[]}],
  timeline:{version:'',periods:[],always:[]},blocks:{},abilities:[],rate:{},rateAt:'',channels:[],
  launchTpl:[{g:'Open-source',items:['GitHub']},{g:'Advertisement',items:['ArXiv upload','Personal homepage','Social Media']},{g:'Connection Opportunity',items:['Email related researchers']}],
  launch:{},letters:['','',''],absorb:[],checks:{},inbox:[],convs:[],hidden:{},students:[]};

/* ============================== utilities ============================== */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')}
const clone=x=>JSON.parse(JSON.stringify(x));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const NOW=new Date(), TODAY=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
const TODAY_ISO=iso(TODAY), TODAY_YM=TODAY_ISO.slice(0,7);
const daysTo=s=>{const d=parseD(s);return d?Math.round((d-TODAY)/864e5):null};
const mdShort=s=>{const d=parseD(s);return d?(d.getMonth()+1)+'.'+d.getDate():''};
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();const w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);return y+'-W'+pad(w)}
function weekMonday(wk){const m=/^(\d{4})-W(\d{2})$/.exec(wk);const y=+m[1],w=+m[2];const jan4=new Date(y,0,4);const day=jan4.getDay()||7;return new Date(y,0,4-day+1+(w-1)*7)}
function addWeeks(wk,n){const m=weekMonday(wk);m.setDate(m.getDate()+7*n);return isoWeek(m)}
function weekRange(wk){const m=weekMonday(wk);const s=new Date(m);s.setDate(s.getDate()+6);return [iso(m),iso(s)]}
const CUR_WK=isoWeek(TODAY);
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
const isObj=x=>x!==null&&typeof x==='object'&&!Array.isArray(x);
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
/* three-way merge: keeps changes made on this device and on others since the last sync */
function merge3(b,l,r){
  if(same(l,r))return l; if(same(b,l))return r; if(same(b,r))return l;
  if(isObj(l)&&isObj(r)){const bb=isObj(b)?b:{};const out={};
    for(const k of new Set([...Object.keys(l),...Object.keys(r)])){
      const inL=k in l,inR=k in r,inB=k in bb;
      if(inL&&inR)out[k]=merge3(bb[k],l[k],r[k]);
      else if(inL){if(!(inB&&same(bb[k],l[k])))out[k]=l[k]}
      else{if(!(inB&&same(bb[k],r[k])))out[k]=r[k]}}
    return out}
  if(Array.isArray(l)&&Array.isArray(r)){
    const all=l.concat(r);
    if(all.every(x=>isObj(x)&&typeof x.id==='string')){
      const bm=new Map((Array.isArray(b)?b:[]).filter(x=>isObj(x)&&x.id).map(x=>[x.id,x]));
      const lm=new Map(l.map(x=>[x.id,x])),rm=new Map(r.map(x=>[x.id,x]));const out=[];
      for(const x of l){if(rm.has(x.id))out.push(merge3(bm.get(x.id),x,rm.get(x.id)));else if(!(bm.has(x.id)&&same(bm.get(x.id),x)))out.push(x)}
      for(const x of r){if(!lm.has(x.id)&&!(bm.has(x.id)&&same(bm.get(x.id),x)))out.push(x)}
      return out}
    if(all.every(x=>typeof x==='string')){const bs=new Set(Array.isArray(b)?b:[]);
      const out=l.filter(x=>!(bs.has(x)&&!r.includes(x)));for(const x of r)if(!out.includes(x)&&!bs.has(x))out.push(x);return out}
  }
  return l;
}
function b64enc(str){const bytes=new TextEncoder().encode(str);let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(bin)}
function b64dec(b64){const bin=atob(b64.replace(/\s/g,''));const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder().decode(bytes)}
const ls={get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* line format used by every editable block:
   "- text" bullet · "  - text" sub-bullet · "=> a → b" chain · other lines are paragraphs */
function renderText(text){
  const lines=String(text||'').split('\n');let html='',list=null;
  const flush=()=>{if(list){html+=ulTree(list);list=null}};
  for(const raw of lines){
    if(!raw.trim()){flush();continue}
    const m=/^(\s*)[-*]\s+(.*)$/.exec(raw);
    if(m){const lvl=m[1].length>=2?1:0;list=list||[];
      if(lvl===0||!list.length)list.push({t:m[2],sub:[]});else list[list.length-1].sub.push(m[2]);continue}
    flush();
    const c=/^=>\s*(.*)$/.exec(raw.trim());
    if(c){html+=`<div class="chain">${c[1].split('→').map(s=>`<span>${md(s.trim())}</span>`).join('<i>→</i>')}</div>`;continue}
    html+=`<p class="para" data-find>${md(raw.trim())}</p>`;
  }
  flush();return html}
function ulTree(list){return `<ul class="list">${list.map(n=>`<li data-find>${md(n.t)}${n.sub.length?`<ul class="list">${n.sub.map(s=>`<li>${md(s)}</li>`).join('')}</ul>`:''}</li>`).join('')}</ul>`}

/* ============================== state ============================== */
let D=null;                       // synced data (lives in the private repo)
const CFG_KEY='phd-planner.github',CACHE_KEY='phd-planner.cache',UI_KEY='phd-planner.ui',PREVIEW_KEY='phd-planner.preview';
const U=Object.assign({tab:'week',week:'',rf:'',rsort:false,ff:'hi',tf:'ddl',cfWho:'',cfTag:'',theme:'system',pickArea:'',paper:'C',draft:'',sub:'half'},ls.get(UI_KEY)||{});
U.exp=U.exp||{};U.selView=U.selView||{};
const T={editStudent:'',addingStudent:false,editTodo:'',ddlOpen:{},open:{},openLog:{},editBlock:'',editItem:'',adding:'',editConv:'',picker:false,confirm:'',connectErr:'',connectStage:'',stale:{}};
const saveUI=()=>ls.set(UI_KEY,U);
let IX={items:new Map(),todos:new Map(),byItem:new Map()};
const adopt=x=>normalize(clone(x));
function normalize(d){const out=Object.assign(clone(EMPTY),d||{});for(const k of Object.keys(EMPTY))if(out[k]==null)out[k]=clone(EMPTY[k]);
  for(const it of out.items){if(it.kind==='lead'){it.kind='collab';it.set='collab'}if(it.area==='intern'||it.area==='visit')it.area='exp'}
  return out}
function reindex(){PLAN_CACHE={};
  IX={items:new Map(D.items.map(x=>[x.id,x])),todos:new Map(D.todos.map(t=>[t.id,t])),byItem:new Map()};
  for(const t of D.todos){if(t.del)continue;if(!IX.byItem.has(t.item))IX.byItem.set(t.item,[]);IX.byItem.get(t.item).push(t)}
}
const itemById=id=>IX.items.get(id);
const todoById=id=>IX.todos.get(id);
const todosOf=it=>IX.byItem.get(it.id)||[];
const liveTodos=()=>D.todos.filter(t=>!t.del&&IX.items.has(t.item));
const label=it=>it.kind==='proj'?it.id+' · '+it.title:it.kind==='promo'?((itemById(it.paper)||{}).title||it.title)+' · 宣传':it.title;
const pri=it=>it.pri||'';
const st=it=>it.st||SETS[it.set||KIND_SET[it.kind]||'todo'][0];
const setOf=it=>it.set||KIND_SET[it.kind]||'todo';
const areaItems=(area,kind)=>D.items.filter(x=>x.area===area&&(!kind||x.kind===kind));
const week=wk=>D.weeks[wk]||{plan:[],goals:'',review:'',rec:{},focus:{}};
function ensureWeek(wk){if(!D.weeks[wk])D.weeks[wk]={plan:[],goals:'',review:'',rec:{},focus:{}};const w=D.weeks[wk];w.plan=w.plan||[];w.rec=w.rec||{};w.focus=w.focus||{};PLAN_CACHE={};return w}
let PLAN_CACHE={};
function planIds(wk){if(PLAN_CACHE[wk])return PLAN_CACHE[wk];
  const W=week(wk);const [mon,sun]=weekRange(wk);const skip=W.skip||{};
  const auto=liveTodos().filter(t=>t.ddl&&!skip[t.id]&&((t.ddl>=mon&&t.ddl<=sun)||(wk===CUR_WK&&t.ddl<mon&&!t.done))).sort((a,b)=>a.ddl<b.ddl?-1:1).map(t=>t.id);
  const ids=[...(W.plan||[]).filter(id=>!skip[id]),...auto];return PLAN_CACHE[wk]=[...new Set(ids)]}
const inWeek=(id,wk)=>planIds(wk).includes(id);
function weekAdd(wk,id){const w=ensureWeek(wk);w.skip=w.skip||{};delete w.skip[id];if(!w.plan.includes(id))w.plan.push(id)}
function weekRemove(wk,id){const w=ensureWeek(wk);w.plan=w.plan.filter(x=>x!==id);delete w.focus[id];const t=todoById(id);if(t&&t.ddl){w.skip=w.skip||{};w.skip[id]=true}}
const block=id=>D.blocks[id]||{title:'',type:'list',text:''};
const addLog=(item,t,extra)=>D.logs.push(Object.assign({id:uid(),item,d:TODAY_ISO,t},extra||{}));

/* ============================== storage & sync ============================== */
const GH={cfg:null,
  base(){const c=this.cfg;return `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`},
  url(){return this.base()+'/contents/'+this.cfg.path.split('/').map(encodeURIComponent).join('/')},
  h(accept){return {'Authorization':'Bearer '+this.cfg.token,'Accept':accept||'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}},
  async repo(){const r=await fetch(this.base(),{headers:this.h(),cache:'no-store'});if(!r.ok)throw await ghErr(r);return r.json()},
  async get(){
    const q='?ref='+encodeURIComponent(this.cfg.branch);
    const r=await fetch(this.url()+q,{headers:this.h(),cache:'no-store'});
    if(r.status===404)return {missing:true};
    if(!r.ok)throw await ghErr(r);
    const j=await r.json();let text;
    if(j.encoding==='base64'&&j.content)text=b64dec(j.content);
    else{const r2=await fetch(this.url()+q,{headers:this.h('application/vnd.github.raw+json'),cache:'no-store'});if(!r2.ok)throw await ghErr(r2);text=await r2.text()}
    return {data:normalize(JSON.parse(text)),sha:j.sha}},
  async put(data,sha,message){
    const body={message,content:b64enc(JSON.stringify(data,null,1)+'\n'),branch:this.cfg.branch};if(sha)body.sha=sha;
    const r=await fetch(this.url(),{method:'PUT',headers:Object.assign(this.h(),{'Content-Type':'application/json'}),body:JSON.stringify(body)});
    if(!r.ok)throw await ghErr(r);return (await r.json()).content.sha}
};
async function ghErr(r){let m='';try{m=(await r.json()).message||''}catch(e){}const e=new Error(m||('HTTP '+r.status));e.status=r.status;return e}
const cfgKey=c=>c?[c.owner,c.repo,c.branch,c.path].join('/'):'';

const Sync={mode:'none',sha:null,base:null,status:'none',msg:'',lastAt:'',pending:false,pushing:false,again:false,timer:null,acts:[],
  cache(){ls.set(CACHE_KEY,{key:cfgKey(GH.cfg),D,base:this.base,sha:this.sha,dirty:this.pending})},
  changed(act){
    if(this.mode==='preview'){ls.set(PREVIEW_KEY,D);this.status='local';this.lastAt=nowHM();paintSync();return}
    if(this.mode!=='github')return;
    this.pending=true;if(act&&!this.acts.includes(act))this.acts.push(act);
    this.cache();if(!this.pushing)this.status='dirty';paintSync();
    clearTimeout(this.timer);this.timer=setTimeout(()=>this.push(),1500)},
  async push(){
    if(this.mode!=='github')return;
    if(this.pushing){this.again=true;return}
    if(!this.pending){this.status='ok';paintSync();return}
    clearTimeout(this.timer);this.pushing=true;this.status='saving';paintSync();
    const acts=this.acts.splice(0);const msg='plans: '+(acts.slice(0,4).join('、')||'更新');
    try{
      for(let attempt=0;;attempt++){
        const snap=clone(D);
        try{const sha=await GH.put(snap,this.sha,msg);this.sha=sha;this.base=snap;this.pending=!same(D,snap);
          this.status=this.pending?'dirty':'ok';this.lastAt=nowHM();this.cache();break}
        catch(e){
          if((e.status===409||e.status===422)&&attempt<3){
            const remote=await GH.get();
            if(remote.missing){this.sha=null;continue}
            D=adopt(merge3(this.base,D,remote.data));this.base=remote.data;this.sha=remote.sha;reindex();renderSoft();continue}
          throw e}
      }
    }catch(e){
      this.acts.unshift(...acts);this.msg=e.message||'';
      this.status=(e.status===401||e.status===403)?'auth':(navigator.onLine===false||!e.status)?'offline':'error';
    }finally{this.pushing=false;paintSync();
      if(this.again){this.again=false;if(this.pending){clearTimeout(this.timer);this.timer=setTimeout(()=>this.push(),800)}}}
  },
  async refresh(){
    if(this.mode!=='github'||this.pushing)return;
    try{const remote=await GH.get();if(remote.missing||remote.sha===this.sha)return;
      D=adopt(this.pending?merge3(this.base,D,remote.data):remote.data);this.base=remote.data;this.sha=remote.sha;
      reindex();this.cache();this.status=this.pending?'dirty':'ok';this.lastAt=nowHM();paintSync();renderSoft();
      if(this.pending)this.push();
    }catch(e){}
  }
};
function paintSync(){
  const b=document.getElementById('sync');const s=Sync.status;b.dataset.s=s;
  b.textContent={none:'—',local:'本地预览',ok:'已同步 '+Sync.lastAt,dirty:'待保存…',saving:'保存中…',offline:'离线：改动存在本机',auth:'Token 失效',error:'同步出错，点我重试'}[s]||s;
  b.title=Sync.msg||'';
}

/* ============================== mutations ============================== */
function commit(act){reindex();Sync.changed(act);render()}
/* ticking a box: save now, re-sort a beat later so the check animation is seen before the row slides away
   (and never while the user is typing somewhere — renderSoft waits for the field to lose focus) */
let soonT=0;
function commitSoon(act){reindex();Sync.changed(act);clearTimeout(soonT);soonT=0;if(!Motion.ok()){render();return}soonT=setTimeout(()=>{soonT=0;renderSoft()},420)}
function setDone(id,on){const t=todoById(id);if(!t)return;t.done=on;
  if(on){t.doneAt=TODAY_ISO;addLog(t.item,'完成：'+t.t,{auto:true,todo:t.id})}
  else{t.doneAt='';D.logs=D.logs.filter(l=>!(l.auto&&l.todo===id))}}
function addTodo(item,t,ddl,wk){const td={id:uid(),item,t,ddl:ddl||'',done:false,created:TODAY_ISO};D.todos.push(td);if(wk)ensureWeek(wk).plan.push(td.id);return td}
function deleteTodo(id){const t=todoById(id);if(!t)return;
  const used=Object.values(D.weeks).some(w=>(w.plan||[]).includes(id));
  if(used)t.del=true;else D.todos=D.todos.filter(x=>x.id!==id);
  D.logs=D.logs.filter(l=>!(l.auto&&l.todo===id))}
function nextProjId(){for(let c=65;c<91;c++){const id=String.fromCharCode(c);if(!itemById(id))return id}return 'P'+uid()}

/* ============================== components ============================== */
/* Layering: every item, group and note is a collapsible "window". Collapsed state lives in U.exp
   (per device). Bodies are always rendered but hidden, so search can find and open them. */
const isHidden=k=>!!(D.hidden&&D.hidden[k]);
const isOpen=(k,def)=>k in U.exp?!!U.exp[k]:!!def;
const hasContent=h=>/<(input|textarea|select|button)\b/.test(h)||h.replace(/<[^>]+>/g,'').trim()!=='';
const AREA_TAB={research:['research',''],exp:['exp',''],intern:['exp',''],visit:['exp',''],admin:['admin',''],career:['dim',''],profile:['dim',''],expo:['dim',''],net:['dim',''],talk:['dim',''],service:['dim',''],step:['think','full']};
const plain=s=>String(s||'').replace(/\*\*/g,'');
function stSel(it){const v=st(it);const opts=SETS[setOf(it)];return `<select class="pill st" data-act="st" data-id="${esc(it.id)}" aria-label="状态：${esc(it.title)}">${(opts.includes(v)?opts:[v,...opts]).map(k=>`<option${k===v?' selected':''}>${esc(k)}</option>`).join('')}</select>`}
function dueBadge(t){if(t.done||!t.ddl)return '';const n=daysTo(t.ddl);if(n===null)return '';
  if(n<0)return `<span class="due over">逾期 ${-n} 天</span>`;if(n===0)return `<span class="due over">今天</span>`;
  return `<span class="due ${n<=7?'soon':'later'}">${n<=7?'还剩 '+n+' 天':mdShort(t.ddl)}</span>`}

  const byArea={};const slot=(it,iid)=>{const a=it?secOf(it.area):'other';const A=byArea[a]=byArea[a]||{};return A[iid]=A[iid]||{w:[],t:[]}};

/* ============================== motion ============================== */
/* A render replaces the whole panel, so motion is layered on afterwards: rows and cards that survive slide from where
   they were (FLIP), new ones fade in, removed ones fade out as detached ghosts, a new tab or week slides in.
   Opening a section animates its height. All of it is skipped when the system asks for reduced motion. */
const Motion=(()=>{
  const EASE='cubic-bezier(.32,.72,0,1)';
  const SEL='.td,.lc,.it,.grp-s,.sub-x,.wk-area,.wk-it,.log-e,.tl-p,.fr,.stu,.inbox-i,.row-foot,.sub-k,.cluster-k,.ch-box,form';
  const rm=matchMedia('(prefers-reduced-motion: reduce)');
  const ok=()=>!rm.matches&&typeof Element.prototype.animate==='function';
  let lastSig='';
  const key=el=>{
    if(el.tagName==='FORM')return 'f:'+el.dataset.form+':'+(el.dataset.id||el.dataset.item||'');
    if(el.id)return '#'+el.id;
    if(el.dataset.key)return 'k:'+el.dataset.key;
    const c=el.classList;
    if(c.contains('wk-area'))return 'wa:'+el.dataset.c;
    if(c.contains('wk-it')){const h=el.querySelector('.wk-it-h');return h?'wi:'+(h.dataset.target||h.textContent):''}
    if(c.contains('tl-p')){const w=el.querySelector('.tl-when');return w?'tl:'+w.textContent:''}
    const cb=el.querySelector('input[type=checkbox]');if(cb)return 'cb:'+(cb.id||cb.dataset.act+':'+cb.dataset.id);
    const d=el.querySelector('[data-id]');return d?c[0]+':'+d.dataset.act+':'+d.dataset.id:c[0]+':'+el.textContent.trim().slice(0,40)};
  function collect(panel){const m=new Map(),n={};
    for(const el of panel.querySelectorAll(SEL)){let k=key(el);if(!k)continue;n[k]=(n[k]||0)+1;if(n[k]>1)k+='#'+n[k];m.set(k,el)}
    return m}
  const shown=r=>r.width>0||r.height>0;
  function before(sig){
    const panel=document.getElementById('p-'+U.tab);
    if(!ok()||sig!==lastSig||!panel)return null;
    const els=collect(panel),rects=new Map();
    for(const [k,el] of els){const r=el.getBoundingClientRect();if(shown(r))rects.set(k,r)}
    return {els,rects,bars:[...panel.querySelectorAll('.bar i')].map(b=>b.style.width)}}
  function after(sig,snap){
    const panel=document.getElementById('p-'+U.tab);const prev=lastSig;lastSig=sig;
    if(!ok()||!panel)return;
    if(!snap){if(prev&&prev!==sig)enter(panel,prev,sig);return}
    const now=collect(panel),vh=innerHeight,vis=r=>r.bottom>-80&&r.top<vh+80;
    const up=el=>{const p=el.parentElement&&el.parentElement.closest(SEL);return p&&panel.contains(p)?p:null};
    const moved=new Map(),fresh=new Map();
    for(const [k,el] of now){const r=el.getBoundingClientRect();if(!shown(r))continue;const o=snap.rects.get(k);
      if(o)moved.set(el,{dx:o.left-r.left,dy:o.top-r.top,show:vis(o)||vis(r)});else if(!snap.els.has(k))fresh.set(el,r)}
    for(const [el,m] of moved){
      const p=up(el),pm=p&&moved.get(p);const x=m.dx-(pm?pm.dx:0),y=m.dy-(pm?pm.dy:0);
      if(m.show&&(Math.abs(x)>=1||Math.abs(y)>=1))el.animate([{transform:`translate(${x}px,${y}px)`},{transform:'none'}],{duration:360,easing:EASE})}
    for(const [el,r] of fresh){const p=up(el);if(p&&fresh.has(p)||!vis(r))continue;
      el.animate([{opacity:0,transform:'translateY(-6px) scale(.985)'},{opacity:1,transform:'none'}],{duration:280,easing:EASE})}
    const okey=new Map([...snap.els].map(([k,el])=>[el,k]));let n=0;
    for(const [k,el] of snap.els){
      if(now.has(k))continue;const r=snap.rects.get(k);if(!r||!vis(r)||r.height>700)continue;
      const p=el.parentElement&&el.parentElement.closest(SEL),pk=p&&okey.get(p);if(pk&&!now.has(pk))continue;
      if(++n>16)break;ghost(el,r)}
    panel.querySelectorAll('.bar i').forEach((b,i)=>{const w=snap.bars[i];if(w!=null&&w!==b.style.width)b.animate([{width:w},{width:b.style.width}],{duration:520,easing:EASE})})}
  /* a removed row lingers for a moment where it was, then fades */
  function ghost(el,r){
    el.removeAttribute('id');el.querySelectorAll('[id]').forEach(x=>x.removeAttribute('id'));
    el.inert=true;el.setAttribute('aria-hidden','true');
    Object.assign(el.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',margin:'0',zIndex:'25',pointerEvents:'none'});
    document.body.appendChild(el);
    const a=el.animate([{opacity:1,transform:'none'},{opacity:0,transform:'scale(.97)'}],{duration:220,easing:'ease-out',fill:'forwards'});
    a.onfinish=()=>el.remove()}
  function enter(panel,prev,sig){
    const [pt,pw]=prev.split('|'),[t,w]=sig.split('|');

    panel.animate([from,{opacity:1,transform:'none'}],{duration:340,easing:EASE})}
  /* open / close a section body by animating its height (and padding, and the parent's gap) */
  function slide(body,open){
    const box=body.parentElement;
    const cur=()=>{const c=getComputedStyle(body);return {h:body.getBoundingClientRect().height,pt:parseFloat(c.paddingTop)||0,pb:parseFloat(c.paddingBottom)||0,bt:parseFloat(c.borderTopWidth)||0,mt:parseFloat(c.marginTop)||0,o:+c.opacity}};

  function hide(el){if(el.hidden||el._hide)return;if(!ok()){el.hidden=true;return}

function textOf(el){let s='';const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('select,button.x,.due,input,.wkb,.ichip')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});while(w.nextNode())s+=w.currentNode.nodeValue+' ';return s.replace(/\s+/g,' ').trim()}
function doSearch(){
  const term=q.value.trim().toLowerCase();if(!term||!D){res.hidden=true;return}
  renderAllPanels();hits=[];
  for(const el of document.querySelectorAll('#panels [data-find]')){const txt=textOf(el);const i=txt.toLowerCase().indexOf(term);if(i<0)continue;
    hits.push({el,txt,i,tab:el.closest('[data-panel]').dataset.panel});if(hits.length>=50)break}
  res.innerHTML=hits.length?hits.map((h,k)=>{const a=Math.max(0,h.i-36),b=Math.min(h.txt.length,h.i+term.length+60);
    return `<button type="button" data-hit="${k}"><span class="rt">${PANELNAME[h.tab]}</span>${a>0?'…':''}${esc(h.txt.slice(a,h.i))}<mark>${esc(h.txt.slice(h.i,h.i+term.length))}</mark>${esc(h.txt.slice(h.i+term.length,b))}${b<h.txt.length?'…':''}</button>`}).join('')
    :`<div class="empty">没有找到「${esc(q.value.trim())}」。</div>`;
  res.hidden=false}
q.addEventListener('input',doSearch);

q.addEventListener('keydown',e=>{if(e.key==='Escape'){q.value='';res.hidden=true;q.blur()}if(e.key==='Enter'){const f=res.querySelector('button');if(f)f.click()}});
res.addEventListener('click',e=>{const b=e.target.closest('[data-hit]');if(!b)return;const h=hits[+b.dataset.hit];res.hidden=true;if(!h)return;
  U.tab=h.tab;saveUI();try{history.replaceState(null,'','#'+h.tab)}catch(e){}renderTabs();for(const id of PANEL_IDS)document.getElementById('p-'+id).hidden=id!==h.tab;
  reveal(h.el);requestAnimationFrame(()=>flash(h.el))});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))res.hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){e.preventDefault();q.focus()}});

/* ============================== boot ============================== */
/* template: the example data is written around one week (exampleAnchor); move every date to the viewer's week */
function rebaseExample(d){
  if(!d||!d.exampleAnchor)return d;
  const k=Math.round((Date.parse(weekRange(CUR_WK)[0]+'T00:00:00Z')-Date.parse(d.exampleAnchor+'T00:00:00Z'))/6048e5);delete d.exampleAnchor;if(!k)return d;
  const day=s=>new Date(Date.parse(s+'T00:00:00Z')+k*6048e5).toISOString().slice(0,10);
  const walk=v=>{if(Array.isArray(v))return v.map(walk);
    if(v&&typeof v==='object'){const o={};for(const [key,x] of Object.entries(v))o[/^\d{4}-W\d{2}$/.test(key)?addWeeks(key,k):key]=walk(x);return o}
    if(typeof v==='string'){if(/^\d{4}-\d{2}-\d{2}$/.test(v))return day(v);if(/^\d{4}-W\d{2}$/.test(v))return addWeeks(v,k)}
    return v};
  return walk(d)}
async function boot(){
  const h0=(location.hash||'').slice(1);const h=(h0==='intern'||h0==='visit')?'exp':h0;if(U.tab==='intern'||U.tab==='visit')U.tab='exp';if(U.pickArea&&!SECNAME[U.pickArea])U.pickArea='';if(PANELS[h])U.tab=h;if(!PANELS[U.tab])U.tab='week';U.week='';
  document.getElementById('today-line').textContent='今天 '+TODAY_ISO.replace(/-/g,'.')+' · '+CUR_WK;
  applyTheme();
  const cfg=ls.get(CFG_KEY);const seedEl=document.getElementById('seed');
  if(cfg&&cfg.token){
    GH.cfg=cfg;Sync.mode='github';
    const cache=ls.get(CACHE_KEY);
    if(cache&&cache.D&&cache.key===cfgKey(cfg)){D=normalize(cache.D);Sync.base=cache.base;Sync.sha=cache.sha;Sync.pending=!!cache.dirty;Sync.status=Sync.pending?'dirty':'ok';reindex();paintSync();render()}
    else{const host=document.getElementById('panels');host.dataset.ready='';host.innerHTML='<p class="blank">正在从私有仓库读取数据…</p>'}
    try{const remote=await GH.get();
      if(remote.missing){if(!D){T.connectStage='missing';renderConnect();return}Sync.sha=null;Sync.base={};Sync.pending=true;Sync.push();return}
      D=adopt(D&&Sync.pending?merge3(Sync.base,D,remote.data):remote.data);
      Sync.base=remote.data;Sync.sha=remote.sha;Sync.lastAt=nowHM();Sync.status=Sync.pending?'dirty':'ok';Sync.cache();reindex();paintSync();render();
      if(Sync.pending)Sync.push();
    }catch(e){
      if(D){Sync.status=(e.status===401||e.status===403)?'auth':'offline';Sync.msg=e.message;paintSync()}
      else{T.connectErr=(e.status===401?'Token 无效或已过期。':'读取失败：'+e.message);renderConnect()}
    }
  }else if(seedEl){
    Sync.mode='preview';D=normalize(ls.get(PREVIEW_KEY)||rebaseExample(JSON.parse(seedEl.textContent)));Sync.status='local';reindex();paintSync();render();
  }else{renderConnect()}
}
boot().then(()=>setTimeout(checkUpdate,1500));
})();
